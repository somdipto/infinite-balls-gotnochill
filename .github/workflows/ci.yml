name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run ci
      - run: npx playwright install --with-deps chromium
        if: matrix.node == 22
      - run: npm run browser-smoke
        if: matrix.node == 22
      - run: npm run package-smoke
        if: matrix.node == 22
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-node-${{ matrix.node }}
          path: artifacts/
          if-no-files-found: ignore
